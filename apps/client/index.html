<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercicat Vertical Slice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a1e;
        color: #e0e0e0;
        font-family: monospace;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.8);
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #505050;
        font-size: 12px;
        line-height: 1.6;
        width: 280px;
        z-index: 10;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }
      .label {
        color: #a0a0a0;
      }
      .value {
        color: #00ff00;
        font-weight: bold;
      }
      #health { color: #66ff88; }
      #phase { text-transform: uppercase; }
      #end-screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: rgba(8, 8, 12, 0.78);
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
      }
      #end-screen.visible { opacity: 1; pointer-events: auto; }
      #end-message { color: #ffb060; font-size: 28px; font-weight: bold; text-shadow: 0 2px 8px #000; }
      #restart { cursor: pointer; border: 1px solid #ff8040; border-radius: 5px; padding: 10px 26px; background: #301c12; color: #fff; font: inherit; }
      #restart:hover { background: #5a2b18; }
      #status {
        color: #ffff00;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #404040;
      }
      #help {
        position: absolute;
        bottom: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #505050;
        font-size: 11px;
        width: 280px;
      }
      .help-row {
        margin: 4px 0;
        color: #a0a0a0;
      }
      .help-key {
        color: #00ff00;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div style="color: #ff8040; font-weight: bold; margin-bottom: 8px;">MERCICAT VERTICAL SLICE</div>
      <div class="stat">
        <span class="label">Status:</span>
        <span id="status" class="value">Connecting...</span>
      </div>
      <div class="stat">
        <span class="label">Tick:</span>
        <span id="tick" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">FPS:</span>
        <span id="fps" class="value">60</span>
      </div>
      <div class="stat">
        <span class="label">Wave:</span>
        <span id="wave" class="value">1</span>
      </div>
      <div class="stat">
        <span class="label">Players:</span>
        <span id="players" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Enemies:</span>
        <span id="enemies" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Health:</span>
        <span id="health" class="value">100 / 100</span>
      </div>
      <div class="stat">
        <span class="label">Score:</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Phase:</span>
        <span id="phase" class="value">playing</span>
      </div>
    </div>
    <div id="end-screen" aria-live="assertive">
      <div id="end-message">Victory! Wave 5 Complete</div>
      <button id="restart" type="button">Restart</button>
    </div>
    <div id="help">
      <div style="color: #ff8040; font-weight: bold; margin-bottom: 6px;">CONTROLS</div>
      <div class="help-row"><span class="help-key">WASD</span> Move</div>
      <div class="help-row"><span class="help-key">MOUSE</span> Aim & Attack</div>
      <div class="help-row" style="margin-top: 8px; color: #4080f0;">■ Blue = You</div>
      <div class="help-row" style="color: #ff6040;">■ Red = Enemies</div>
      <div class="help-row" style="color: #ffff00;">○ Yellow = Projectiles</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
